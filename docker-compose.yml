version: '3.9'

services:

  # GATEWAY (ENTRY)
  gateway-service:
    build:
      context: .
      dockerfile: core/gateway/Dockerfile
    container_name: gateway-service
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - orchestrator-service


  # ORCHESTRATOR
  orchestrator-service:
    build:
      context: .
      dockerfile: core/orchestrator/Dockerfile
    container_name: orchestrator-service
    ports:
      - "8002:8002"
    env_file:
      - .env
    depends_on:
      - mcp-service


  # MCP SERVER
  mcp-service:
    build:
      context: .
      dockerfile: core/mcp_server/Dockerfile
    container_name: mcp-service
    ports:
      - "8001:8001"
    env_file:
      - .env
    depends_on:
      - tools-service


  # TOOLS
  tools-service:
    build:
      context: .
      dockerfile: tools/Dockerfile
    container_name: tools-service
    ports:
      - "9001:9001"
      - "9002:9002"
      - "9003:9003"
      - "9004:9004"
    env_file:
      - .env