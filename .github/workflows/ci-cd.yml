name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  validate:
    name: Validate, install, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install wheel
          pip install -r requirements.txt
          pip install pytest

      - name: Check Python syntax
        run: |
          python -m compileall core orchestrator mcp_server tools

      - name: Run unit tests if present
        run: |
          if [ -d tests ] || ls *_test.py 1> /dev/null 2>&1; then
            pytest --maxfail=1 --disable-warnings -q
          else
            echo "No tests found, skipping pytest."
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate docker-compose
        run: docker compose -f docker-compose.yml config

      - name: Build Docker services
        run: docker compose -f docker-compose.yml build

  deploy:
    name: Deploy preparation
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate docker-compose
        run: docker compose -f docker-compose.yml config

      - name: Build production images
        run: docker compose -f docker-compose.yml build

      - name: Deployment placeholder
        run: |
          echo "CI passes. Add a deployment action here with your registry or cloud provider credentials."
